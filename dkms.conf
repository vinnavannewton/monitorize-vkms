# DKMS package metadata for monitorize-vkms 0.2.1.
# Keep PACKAGE_VERSION in sync with the repository VERSION file.
PACKAGE_NAME="monitorize-vkms"
PACKAGE_VERSION="0.2.1"

BUILT_MODULE_NAME[0]="monitorize_vkms"
BUILT_MODULE_LOCATION[0]="src/vkms"
DEST_MODULE_NAME[0]="monitorize_vkms"
# DKMS maps this to its distribution-specific high-priority location (for
# example /extra on Fedora, /updates/dkms on Debian/Ubuntu, and /updates on SUSE).
DEST_MODULE_LOCATION[0]="/updates/dkms"

# $kernelver is supplied by DKMS, including when it builds for a future kernel.
MAKE[0]="make -C src/vkms KDIR=/lib/modules/$kernelver/build"
CLEAN="make -C src/vkms KDIR=/lib/modules/$kernelver/build clean"
# This kernel-space carry is intentionally opt-in for each booted kernel. A
# future kernel must be tested by the installer before its module is installed.
AUTOINSTALL="no"
NO_WEAK_MODULES="yes"
